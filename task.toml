schema_version = "1.3"

[task]
name = "local/anonymous-clinic-log-matching"
authors = [{ name = "fengyin" }]
description = "Match anonymous clinic queue logs to arrival profiles and recover the shared service capacity from all observations simultaneously."
keywords = ["simulation", "queueing", "inverse-matching", "calibration"]

[agent]
timeout_sec = 3600

[environment]
build_timeout_sec = 600
cpus = 2
memory_mb = 2048
storage_mb = 4096
gpus = 0
allow_internet = true

[verifier]
timeout_sec = 600

[metadata]
difficulty = "hard"
category = "simulation"
tags = ["queue-simulation", "inverse-matching", "state-recovery", "canonical-json"]
expert_time_estimate = "55m"
